<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visor SIGNUM </title>
    <!-- Favicon -->
    <link rel="icon" href="favicon/favicon.ico" sizes="any">
    <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon/favicon-16x16.png" sizes="16x16">
    <link rel="manifest" href="favicon/site.webmanifest">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>

    <!-- Mobile Controls -->
    <div class="mobile-controls">
        <button id="mobile-menu-btn" class="mobile-btn" type="button">
            <i class="fas fa-layer-group"></i> Capas
        </button>

    </div>

    <!-- Main Control Panel -->
    <div id="control-panel">
        <div class="panel-header">
            <h3><i class="fas fa-layer-group"></i> Capas</h3>
            <button id="close-panel-btn" class="close-btn" type="button" aria-label="Cerrar panel">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Collapsible Sections -->
        <div class="control-section collapsible active">
            <div class="section-header">
                <h4>Herramientas</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content">
                <!-- Search Control -->
                <div class="layer-toggle">
                    <div id="search-control" class="search-control">
                        <input type="text" id="search-input" placeholder="Buscar...">
                        <button id="search-button"><i class="fas fa-search"></i></button>
                        <div id="search-results"></div>
                    </div>
                </div>
            </div>
            <div class="section-content">
                <!-- Measure Tool -->
                <div class="layer-toggle">
                    <button id="measure-toggle" class="control-btn" type="button">
                        <i class="fas fa-ruler"></i> Medir Distancia
                    </button>
                    <div id="measure-result">
                        <span>Distancia total:</span> <span id="measure-value">0</span> km
                    </div>
                </div>
                <!-- Dashboard Statistics -->
                <div class="layer-toggle">
                    <button id="stats-toggle" class="control-btn" type="button">
                        <i class="fas fa-chart-bar"></i> Estadísticas
                    </button>
                    <div id="stats-panel" class="stats-panel">
                        <div class="stats-filters">
                            <select id="stats-layer-select">
                                <option value="all">Todas las capas</option>
                                <option value="polyline1">Linea1</option>
                                <option value="polyline2">Linea2</option>
                                <option value="polyline3">Linea3</option>
                                <option value="polyline4">Linea4</option>
                                <option value="polyline5">Linea5</option>
                                <option value="polyline6">Linea6</option>
                            </select>
                            <select id="stats-field-select">
                                <option value="Campo1">Campo1</option>
                                <option value="Campo2">Campo2</option>
                                <option value="Campo3">Campo3</option>
                            </select>
                            <div class="stats-filters">
<!--                                 <select id="stats-layer-select">
                                </select> --> -->
                                <input type="text" id="attribute-filter" placeholder="Filtrar por valor" list="attribute-suggestions" style="width: 200px;" />
                                <datalist id="attribute-suggestions"></datalist>
                                <button id="apply-stats-btn">Aplicar</button>
                                <button id="export-stats-btn" title="Exportar a Excel"><i class="fas fa-file-export"></i></button>
                            </div>
                        </div>
                        <div id="stats-summary"></div>
                        <canvas id="stats-chart" height="180"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-section collapsible active">
            <div class="section-header">
                <h4>Mapa Base</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content">
                <div class="layer-toggle">
                    <input type="radio" id="base-street" name="base-map" checked>
                    <label for="base-street">
                        <i class="fas fa-map"></i> OpenStreetMap
                    </label>
                </div>
                <div class="layer-toggle">
                    <input type="radio" id="base-satellite" name="base-map">
                    <label for="base-satellite">
                        <i class="fas fa-satellite"></i> Satélite (ESRI)
                    </label>
                </div>
            </div>
        </div>

        <div class="control-section collapsible active">
            <div class="section-header">
                <h4>Capas Principales</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content compact">
                <!-- <div class="layer-toggle">
                    <input type="checkbox" id="point-layer-toggle" checked>
                    <label for="point-layer-toggle">
                        <span class="layer-color point-color"></span>
                        Edificaciones
                    </label>
                </div> -->
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline1-layer-toggle" checked>
                    <label for="polyline1-layer-toggle">
                        <span class="layer-color polyline1-color"></span>
                        Linea1
                    </label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline2-layer-toggle" checked>
                    <label for="polyline2-layer-toggle">
                        <span class="layer-color polyline2-color"></span>
                        Linea2
                    </label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline3-layer-toggle" checked>
                    <label for="polyline3-layer-toggle">
                        <span class="layer-color polyline3-color"></span>
                        Linea3
                    </label>
                </div>

                <div class="layer-toggle">
                    <input type="checkbox" id="polyline4-layer-toggle" checked>
                    <label for="polyline4-layer-toggle">
                        <span class="layer-color polyline4-color"></span>
                        Linea4
                    </label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline5-layer-toggle" checked>
                    <label for="polyline5-layer-toggle">
                        <span class="layer-color polyline5-color"></span>
                        Linea5
                    </label>
                </div>
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline6-layer-toggle" checked>
                    <label for="polyline6-layer-toggle">
                        <span class="layer-color polyline6-color"></span>
                        Linea6
                    </label>
                </div>
            </div>
        </div>
        <div class="control-section collapsible not-active">
            <div class="section-header">
                <h4>Info Base</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content compact">
                <div class="layer-toggle">
                <input type="checkbox" id="veredas-layer-toggle">
                <label for="veredas-layer-toggle">
                    <span class="layer-color polygon-color"></span> Veredas
                </label>
                </div>
                <div class="layer-toggle">
                <input type="checkbox" id="municipios-layer-toggle">
                <label for="municipios-layer-toggle">
                    <span class="layer-color polygon-color"></span> Municipios
                </label>
                </div>
            </div>
            </div>

            <div class="control-section collapsible not-active">
            <div class="section-header">
                <h4>Procesos</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content compact">
                <div class="layer-toggle">
                <input type="checkbox" id="procesos-layer-toggle">
                <label for="procesos-layer-toggle">
                    <span class="layer-color point-color"></span> Puntos de Procesos
                </label>
                </div>
            </div>
        </div>

        <div class="control-section collapsible active">
            <div class="section-header">
                <h4>Etiquetas</h4>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="section-content compact">
                <!-- <div class="layer-toggle">
                </div> -->
                <div class="layer-toggle">
                    <input type="checkbox" id="polyline-labels-toggle">
                    <label for="polyline-labels-toggle">
                        <i class="fas fa-tag polyline-label-icon"></i>
                        Etiquetas de Linea
                    </label>
                </div>
                <!-- <div class="layer-toggle">
                </div> -->
            </div>
        </div>
    </div>

    <!-- Coordinate Display -->
    <div id="coordinate-display-container">
        <div id="coordinate-display">
            <span id="latitude">0°00'00.00"N</span>, 
            <span id="longitude">0°00'00.00"W</span>
        </div>
        <select id="coord-format" class="format-selector">
            <option value="dms">DMS (4°00'00.00"N)</option>
            <option value="decimal">Decimal (4.000000°)</option>
        </select>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
